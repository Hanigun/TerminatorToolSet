# Terminator Overhaul - Uprising randomizer config v2
# Режим: Хаос (название и описание — в locales, здесь не править)
# Правится руками в Блокноте: # — комментарий, пустые строки можно.
# Ошибка в значении — файл не применится, в отчёте будет файл/секция/строка.
[MODE]
name = chaos

# --- Правила: как мешать ---
# faction_mode: mix — фракции игнорируются, всё вперемешку
# chaos_k: 2.0 — максимальное перемешивание; сложность юнитов
#   игнорируется, k мешает только позиции (не подбор по стоимости)
# diff_soft_pm выкл — не используется в Хаосе
[RULES]
faction_mode = mix
chaos_k = 2.0
count_heads = true
diff_soft_pm = false
no_origin = true
no_neighbours = false
cap_heads = 0
seed_default = 12345

# --- Веса категорий при подборе ---
[WEIGHTS]
squads = 1
cars = 2
tanks = 3
helicopters = 3
inventory_items = 0.2

# --- Секторы: num = difficulty faction protect ---
# difficulty 1..6 обязательна; в Хаосе игнорируется, но файл обязан
# быть полным (проверка и редактор требуют все 22 зоны)
# protect: - | start | capital
[SECTORS]
1 = 4 player start
2 = 5 player start
3 = 5 integrators -
4 = 6 integrators capital
5 = 5 player -
6 = 3 player -
7 = 4 player -
8 = 6 legion -
9 = 5 legion -
10 = 6 legion -
11 = 6 legion -
12 = 3 founders capital
13 = 6 legion -
14 = 6 grey -
15 = 5 grey -
16 = 6 legion -
17 = 5 founders -
18 = 5 legion capital
19 = 4 founders -
20 = 6 legion -
21 = 3 founders -
22 = 4 player start

# --- Юниты: sysname = difficulty category ---
# difficulty: N или N-M (1..6); в Хаосе игнорируется, но файл обязан
# быть полным; юнита нет в списке — наследует зону-источник
[UNITS]

# ---- squads ----
civilian = 6 squads
fnd_at_squad = 5 squads
fnd_engineers = 6 squads
fnd_infantry = 6 squads
fnd_rangers = 6 squads
fnd_snipers = 5 squads
lgn_drones = 5 squads
lgn_homunculus = 5 squads
lgn_rev = 5 squads
lgn_wolfpack = 5 squads
res_engineers = 6 squads
res_militia = 6 squads

# ---- tanks ----
fnd_abrams = 5 tanks

# ---- cars ----
civil_trailer = 6 cars
fnd_bradley = 5 cars
fnd_hummer = 6 cars
fnd_m113 = 6 cars

# ---- inventory_items ----
upgrd_accuracy_generic = 5 inventory_items
upgrd_ammo_capacity_abrams = 6 inventory_items

# --- Лут: редкие предметы отдельно от юнитов ---
# предметы в Хаосе всё равно раскладываются по [LOOT], а не как попало
[LOOT]
rare_min_cost = 1500
rare_only_diff = 4
rare_in_capital = true
common_free = true
