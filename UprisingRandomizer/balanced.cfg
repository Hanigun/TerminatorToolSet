# Terminator Overhaul - Uprising randomizer config v2
# Режим: Баланс (название и описание — в locales, здесь не править)
# Правится руками в Блокноте: # — комментарий, пустые строки можно.
# Ошибка в значении — файл не применится, в отчёте будет файл/секция/строка.
[MODE]
name = balanced

# --- Правила: как мешать ---
# faction_mode: own — юниты только своих фракций по секторам
# chaos_k: 0..2 сила перемешивания (Баланс — среднее)
# diff_soft_pm: галка «±1» — регион 4 берёт юниты 3-5 (края с половинным
#   весом), выкл — строгое попадание в сложность региона
[RULES]
faction_mode = own
chaos_k = 1.0
count_heads = true
diff_soft_pm = true
no_origin = false
no_neighbours = false
cap_heads = 0
seed_default = 12345

# --- Веса категорий при подборе ---
[WEIGHTS]
squads = 1
cars = 2
tanks = 3
helicopters = 3
inventory_items = 0.2

# --- Секторы: num = difficulty faction protect ---
# difficulty 1..6 обязательна; protect: - | start | capital
# стартовые игрока: 1, 2, 22; столицы: 1, 4, 12, 18, 22
[SECTORS]
1 = 2 player start
2 = 2 player start
3 = 3 integrators -
4 = 3 integrators capital
5 = 2 player -
6 = 2 player -
7 = 2 player -
8 = 3 legion -
9 = 3 legion -
10 = 3 legion -
11 = 3 legion -
12 = 2 founders capital
13 = 3 legion -
14 = 3 grey -
15 = 3 grey -
16 = 3 legion -
17 = 2 founders -
18 = 3 legion capital
19 = 2 founders -
20 = 3 legion -
21 = 2 founders -
22 = 2 player start

# --- Юниты: sysname = difficulty category ---
# difficulty: N или N-M (1..6); юнита нет в списке —
#   наследует сложность зоны-источника
[UNITS]

# ---- squads ----
civilian = 3 squads
fnd_at_squad = 2 squads
fnd_infantry = 2 squads
fnd_rangers = 2 squads
lgn_drones = 3 squads
lgn_homunculus = 3 squads
lgn_wolfpack = 3 squads
res_engineers = 3 squads
res_militia = 3 squads

# ---- tanks ----
fnd_abrams = 2 tanks

# ---- cars ----
civil_trailer = 3 cars
fnd_bradley = 2 cars
fnd_hummer = 2 cars
fnd_m113 = 3 cars

# ---- inventory_items ----
upgrd_accuracy_generic = 3 inventory_items
upgrd_ammo_capacity_abrams = 3 inventory_items

# --- Лут: редкие предметы отдельно от юнитов ---
# редкие (cost >= rare_min_cost) только в сложных секторах
# (diff >= rare_only_diff) и столицах
[LOOT]
rare_min_cost = 1500
rare_only_diff = 4
rare_in_capital = true
common_free = true
