# Terminator Overhaul - Uprising randomizer config v2
# Режим: Сложно (название и описание — в locales, здесь не править)
# Правится руками в Блокноте: # — комментарий, пустые строки можно.
# Ошибка в значении — файл не применится, в отчёте будет файл/секция/строка.
[MODE]
name = hard

# --- Правила: как мешать ---
# faction_mode: own — юниты только своих фракций по секторам
# chaos_k: 0..2 сила перемешивания (Сложно — сильное)
# diff_soft_pm выкл — строгое попадание в сложность региона
[RULES]
faction_mode = own
chaos_k = 1.2
count_heads = true
diff_soft_pm = false
no_origin = false
no_neighbours = false
cap_heads = 20
seed_default = 12345

# --- Веса категорий при подборе ---
[WEIGHTS]
squads = 1
cars = 2
tanks = 3
helicopters = 3
inventory_items = 0.2

# --- Секторы: num = difficulty faction protect ---
# difficulty 1..6 обязательна; protect: - | start | capital
# стартовые игрока: 1, 2, 22; столицы: 1, 4, 12, 18, 22
[SECTORS]
1 = 3 player start
2 = 3 player start
3 = 4 integrators -
4 = 4 integrators capital
5 = 3 player -
6 = 3 player -
7 = 3 player -
8 = 4 legion -
9 = 4 legion -
10 = 4 legion -
11 = 4 legion -
12 = 3 founders capital
13 = 4 legion -
14 = 4 grey -
15 = 4 grey -
16 = 4 legion -
17 = 3 founders -
18 = 4 legion capital
19 = 3 founders -
20 = 4 legion -
21 = 3 founders -
22 = 3 player start

# --- Юниты: sysname = difficulty category ---
# difficulty: N или N-M (1..6); юнита нет в списке —
#   наследует сложность зоны-источника
[UNITS]

# ---- squads ----
civilian = 4 squads
fnd_at_squad = 3 squads
fnd_engineers = 3 squads
fnd_infantry = 3 squads
fnd_rangers = 3 squads
fnd_snipers = 3 squads
lgn_drones = 4 squads
lgn_homunculus = 4 squads
lgn_rev = 4 squads
lgn_wolfpack = 4 squads
res_engineers = 4 squads
res_militia = 4 squads

# ---- tanks ----
fnd_abrams = 3 tanks

# ---- cars ----
civil_trailer = 4 cars
fnd_bradley = 3 cars
fnd_hummer = 3 cars
fnd_m113 = 4 cars

# ---- inventory_items ----
upgrd_accuracy_generic = 4 inventory_items
upgrd_ammo_capacity_abrams = 4 inventory_items

# --- Лут: редкие предметы отдельно от юнитов ---
# редкие (cost >= rare_min_cost) только в сложных секторах
# (diff >= rare_only_diff) и столицах
[LOOT]
rare_min_cost = 1500
rare_only_diff = 4
rare_in_capital = true
common_free = true
